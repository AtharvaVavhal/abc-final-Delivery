name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - main

jobs:
  hygiene:
    name: Hygiene
    runs-on: ubuntu-latest

    steps:
      # Full history so the diff base (PR base, or previous commit on a
      # push) is reachable.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Rejects trailing whitespace, a missing final newline, and leftover
      # "<<<<<<< / ======= / >>>>>>>" merge-conflict markers in the changes
      # this ref introduces (not the whole tree).
      - name: Whitespace and conflict-marker check
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE" ]; then BASE="$(git rev-parse HEAD~1)"; fi
          echo "git diff --check ${BASE}..HEAD"
          git diff --check "$BASE" HEAD

  backend:
    name: Backend
    runs-on: ubuntu-latest

    # A real Postgres, not mocks — the §27 e2e suite runs supertest
    # against a real Nest app and a real database (see
    # backend/test/e2e/support/README.md). POSTGRES_DB creates the
    # database on container startup; its name must end in `_test` or
    # test/e2e/support/db.ts's resetDatabase guard refuses to truncate it.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: printforge_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/printforge_ci_test?schema=public

    steps:
      - uses: actions/checkout@v4

      # Node 22, not 20: confirmed live (first CI run) that frontend's
      # vitest/jsdom stack crashes under Node 20's older bundled undici
      # (`webidl.util.markAsUncloneable is not a function`, from jsdom's
      # Cache API shim) — jsdom@30 needs a newer undici than Node 20 ships.
      # Bumped both jobs for consistency, not just frontend.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      # Advisory only. The current tree has known advisories in build/CLI
      # tooling that is NOT on the request path — bcrypt -> @mapbox/node-pre-gyp
      # -> tar, and prisma(dev) -> @prisma/config -> deepmerge-ts. Neither is
      # fixable without a major bump out of this phase's scope; both are
      # tracked in docs/ops/DEPENDENCY-ADVISORIES.md. continue-on-error keeps
      # the build green on the known set while still surfacing anything new.
      - name: Audit dependencies (advisory)
        working-directory: backend
        continue-on-error: true
        run: npm audit --omit=dev

      - name: Generate Prisma client
        working-directory: backend
        run: npm run prisma:generate

      - name: Apply migrations
        working-directory: backend
        run: npm run prisma:migrate:deploy

      - name: Lint
        working-directory: backend
        run: npm run lint

      - name: Build
        working-directory: backend
        run: npm run build

      - name: Unit tests
        working-directory: backend
        run: npm run test

      # backend/.env.test is gitignored and never committed (see
      # backend/test/e2e/support/README.md) — generated here so
      # env.setup.ts (test/jest-e2e.json's setupFiles) has something to
      # load before AppModule is imported. Only NODE_ENV/PORT/DATABASE_URL/
      # JWT_ACCESS_SECRET/REFRESH_TOKEN_SECRET are @IsNotEmpty at boot
      # (src/common/config/env.validation.ts); RAZORPAY_KEY_ID/RESEND/
      # CLOUDINARY vars are deliberately omitted — no e2e spec reaches a
      # real Razorpay/Cloudinary/Resend network call (checkout order
      # creation is DB-only, CloudinaryService is swapped for
      # FakeCloudinaryService in test-app.ts). RAZORPAY_KEY_SECRET and
      # RAZORPAY_WEBHOOK_SECRET ARE required, though — confirmed live
      # (first CI run): payments-race.e2e-spec.ts signs webhook/verify
      # payloads with the real local HMAC check
      # (test/e2e/support/razorpay-signing.ts / RazorpayService's own
      # verifySignature/verifyWebhookSignature), which throws if either is
      # unset — still no real Razorpay network call, just two consistent
      # dummy secrets the test and the app both read.
      # PAYMENT_CREDENTIALS_MASTER_KEY is the same 32-byte test placeholder
      # used by env.validation.spec.ts — phase8/payments-race encrypt
      # PaymentAccount credentials locally (AES-256-GCM), never against a
      # production key.
      - name: Write .env.test
        working-directory: backend
        run: |
          cat > .env.test <<EOF
          NODE_ENV=test
          PORT=4000
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/printforge_ci_test?schema=public
          JWT_ACCESS_SECRET=ci-test-access-secret
          JWT_ACCESS_EXPIRES_IN=15m
          REFRESH_TOKEN_SECRET=ci-test-refresh-secret
          REFRESH_TOKEN_EXPIRES_IN=30d
          RAZORPAY_KEY_SECRET=ci-test-razorpay-key-secret
          RAZORPAY_WEBHOOK_SECRET=ci-test-razorpay-webhook-secret
          PAYMENT_CREDENTIALS_MASTER_KEY=MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
          EOF

      # test/jest-e2e.json already sets maxWorkers: 1 (these tests share
      # one database and run serially) — no extra --runInBand flag needed.
      - name: E2E tests
        working-directory: backend
        run: npm run test:e2e

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # Runtime dependency tree is currently clean; fail the build only on
      # a high/critical runtime advisory so transitive dev-tool noise never
      # blocks CI.
      - name: Audit dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        working-directory: frontend
        run: npm run lint

      # A dummy value — frontend/.env.example references VITE_API_BASE_URL,
      # but no real backend is reachable (or needed) for a build/typecheck/
      # test pass.
      - name: Build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://localhost:4000/api
        run: npm run build

      - name: Test
        working-directory: frontend
        run: npm run test
